# 一時的な診断用: 書誌 API の実際の応答を確認する(PR 前に削除予定)
name: Diagnose book lookup APIs

on:
  push:
    paths:
      - ".github/workflows/lookup-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ISBNS: "9784102472317 4102472312 9784167275730 9784101010137"
    steps:
      - name: Query APIs
        run: |
          for isbn in $ISBNS; do
            echo "################ $isbn"
            echo "=== NDL OpenSearch"
            curl -sS -m 20 -w "\nHTTP %{http_code}\n" "https://ndlsearch.ndl.go.jp/api/opensearch?isbn=$isbn&cnt=5" | head -c 4000; echo
            echo "=== openBD"
            curl -sS -m 20 -w "\nHTTP %{http_code}\n" "https://api.openbd.jp/v1/get?isbn=$isbn" | head -c 1500; echo
            echo "=== Google Books (no key)"
            curl -sS -m 20 -w "\nHTTP %{http_code}\n" "https://www.googleapis.com/books/v1/volumes?q=isbn:$isbn" | head -c 2500; echo
          done
      - name: Probe cover URLs
        run: |
          for isbn in $ISBNS; do
            echo "=== $isbn"
            for u in "https://cover.openbd.jp/$isbn.jpg" "https://ndlsearch.ndl.go.jp/thumbnail/$isbn.jpg"; do
              curl -sS -m 20 -o /dev/null -w "$u -> HTTP %{http_code} %{content_type} %{size_download}B\n" "$u" || true
            done
          done
