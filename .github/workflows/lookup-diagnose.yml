# 一時的な診断用: 書誌 API の実際の応答を確認する(PR 前に削除予定)
name: Diagnose book lookup APIs

on:
  push:
    paths:
      - ".github/workflows/lookup-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: NDL queries
        run: |
          q() { echo "=== $1"; curl -sS -m 30 -w "\nHTTP %{http_code}\n" "$1" | head -c ${2:-6000}; echo; sleep 5; }
          q "https://ndlsearch.ndl.go.jp/api/opensearch?isbn=4102472312&cnt=5"
          q "https://ndlsearch.ndl.go.jp/api/opensearch?title=%E6%B2%B9%E7%94%B0%E7%88%86%E7%A0%B4&cnt=5" 12000
          q "https://ndlsearch.ndl.go.jp/api/opensearch?title=%E6%B2%B9%E7%94%B0%E7%88%86%E7%A0%B4&mediatype=books&cnt=5" 3000
          q "https://ndlsearch.ndl.go.jp/api/opensearch?isbn=9784101010137&cnt=5" 6000
