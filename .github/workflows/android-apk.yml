name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build web assets & sync to Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Secrets が設定されていれば固定鍵でリリース署名する(上書き更新が可能になる)
      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (signed)
        if: steps.keystore.outputs.path != ''
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (keystore secrets not set)
        if: steps.keystore.outputs.path == ''
        working-directory: frontend/android
        run: |
          echo "::warning::署名用Secretsが未設定のためデバッグAPKをビルドします。ビルドごとに署名鍵が変わるため、上書きインストールできない場合があります。"
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bookshelf-apk
          path: frontend/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
